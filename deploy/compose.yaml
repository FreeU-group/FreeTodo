services:
  # API Server
  server:
    container_name: lifetrace-server
    image: freeu/lifetrace-server:latest
    restart: always
    environment:
      LIFETRACE_SERVER__HOST: ${LIFETRACE_SERVER__HOST:-0.0.0.0}
      LIFETRACE_SERVER__PORT: ${LIFETRACE_SERVER__PORT:-8001}
      LIFETRACE_SERVER__DEBUG: ${LIFETRACE_SERVER__DEBUG:-false}
      LIFETRACE_LLM__API_KEY: ${LIFETRACE_LLM__API_KEY}
      LIFETRACE_LLM__BASE_URL: ${LIFETRACE_LLM__BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LIFETRACE_LLM__MODEL: ${LIFETRACE_LLM__MODEL:-qwen-plus}
      LIFETRACE_AUDIO__ASR__API_KEY: ${LIFETRACE_AUDIO__ASR__API_KEY}
      LIFETRACE_TAVILY__API_KEY: ${LIFETRACE_TAVILY__API_KEY}
      LIFETRACE_AGNO__DEFAULT_WORKSPACE: /workspace
      LIFETRACE_AGNO__AGENT_OS__BASE_URL: http://agent:8002
      LIFETRACE_AGNO__AGENT_OS__HOST: agent
      LIFETRACE_AGNO__AGENT_OS__PORT: 8002
    ports:
      - "${LIFETRACE_SERVER__PORT:-8001}:8001"
    command: ["python", "server.py"]
    volumes:
      - ./volume/data:/app/data
    networks:
      - lifetrace-network

  # Agent OS
  agent:
    container_name: lifetrace-agent
    image: freeu/lifetrace-server:latest
    restart: always
    environment:
      LIFETRACE_AGNO__AGENT_OS__HOST: ${LIFETRACE_AGNO__AGENT_OS__HOST:-0.0.0.0}
      LIFETRACE_AGNO__AGENT_OS__PORT: ${LIFETRACE_AGNO__AGENT_OS__PORT:-8002}
      LIFETRACE_AGNO__AGENT_OS__DEBUG: ${LIFETRACE_AGNO__AGENT_OS__DEBUG:-false}
      LIFETRACE_AGNO__AGENT_OS__BASE_URL: http://agent:8002
      LIFETRACE_SERVER__HOST: ${LIFETRACE_SERVER__HOST:-0.0.0.0}
      LIFETRACE_SERVER__PORT: ${LIFETRACE_SERVER__PORT:-8001}
      LIFETRACE_LLM__API_KEY: ${LIFETRACE_LLM__API_KEY}
      LIFETRACE_LLM__BASE_URL: ${LIFETRACE_LLM__BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LIFETRACE_LLM__MODEL: ${LIFETRACE_LLM__MODEL:-qwen-plus}
      LIFETRACE_AUDIO__ASR__API_KEY: ${LIFETRACE_AUDIO__ASR__API_KEY}
      LIFETRACE_TAVILY__API_KEY: ${LIFETRACE_TAVILY__API_KEY}
      LIFETRACE_AGNO__EXTERNAL_TOOLS: ${LIFETRACE_AGNO__EXTERNAL_TOOLS:-[]}
    ports:
      - "${LIFETRACE_AGNO__AGENT_OS__PORT:-8002}:8002"
    command: ["python", "agent_os.py"]
    networks:
      - lifetrace-network

networks:
  lifetrace-network:
    driver: bridge
