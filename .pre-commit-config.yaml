repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: pnpm-lock.yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^frontend/lib/generated/
      - id: trailing-whitespace
        exclude: ^frontend/lib/generated/
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      # Run the linter.
      - id: ruff
        # It is recommended to specify the latest version of Python
        # supported by your project here, or alternatively use
        # pre-commit's default_language_version, see
        # https://pre-commit.com/#top_level-default_language_version
        language_version: python3.12
        files: ^(server|scripts)/
        exclude: ^server/migrations/versions/
        types_or: [ python, pyi ]
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
        language_version: python3.12
        files: ^(server|scripts)/
        types_or: [ python, pyi ]
  - repo: local
    hooks:
      - id: biome-check
        name: Biome check (frontend)
        entry: pnpm --dir frontend exec biome check --write --no-errors-on-unmatched
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|json|jsonc|css|astro|vue|svelte|graphql|gql)$
        pass_filenames: true

      # Temporarily disabled local hooks. Restore these blocks when the local
      # Bandit / Pyright toolchain is ready to be enforced again.
      # - id: bandit
      #   name: Bandit security scan
      #   # Avoid uv venv sync races in concurrent hooks (Windows file-lock issues).
      #   entry: uv run --no-sync bandit -c bandit.yaml
      #   language: system
      #   files: ^(server|scripts)/.*\.py$
      #   pass_filenames: true
      #   require_serial: true

      # - id: pyright
      #   name: Pyright type check
      #   entry: uv run --no-sync python -m pyright --project pyrightconfig.json
      #   language: system
      #   files: ^(server|scripts)/.*\.(py|pyi)$
      #   pass_filenames: true
      #   require_serial: true

      - id: pytest-quick
        name: Pytest quick checks
        entry: uv run --directory server --no-sync pytest -q tests/test_todo_service_mapping.py tests/test_icalendar_service.py tests/test_todo_serialization.py
        language: system
        files: ^(server|tests)/.*\.py$
        pass_filenames: false
        require_serial: true

      - id: tsc-frontend
        name: TypeScript type check (frontend/)
        entry: pnpm --dir frontend run type-check
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      # 前端 TS/TSX/JS/JSX 有效代码行数检查（不含空行和注释，上限 500 行）
      # pre-commit 会传入暂存的文件，只检查这些文件
      - id: check-frontend-code-lines
        name: Check frontend TS/TSX/JS/JSX code lines (max 500)
        entry: node frontend/scripts/check_code_lines.js --include apps,components,electron,lib,scripts --exclude lib/generated,apps/crawler/CrawlerDetailPanel.tsx,apps/crawler/store.ts,apps/todo-intent/TodoIntentPanel.tsx,lib/store/audio-recording-store.ts
        language: system
        files: ^(frontend|scripts)/.*\.(ts|tsx|js|jsx)$
        pass_filenames: true

      # 后端 Python 有效代码行数检查（不含空行和注释，上限 500 行）
      # pre-commit 会传入暂存的文件，只检查这些文件
      - id: check-backend-code-lines
        name: Check backend Python code lines (max 500)
        entry: uv run --directory server --no-sync python ../server/scripts/check_code_lines.py --include server,scripts --exclude server/__pycache__,server/dist,server/migrations/versions
        language: system
        files: ^(server|scripts)/.*\.py$
        pass_filenames: true
        require_serial: true

      # Tauri Rust 有效代码行数检查（不含空行和注释，上限 500 行）
      # pre-commit 会传入暂存的文件，只检查这些文件
      - id: check-tauri-rust-code-lines
        name: Check Tauri Rust code lines (max 500)
        entry: node frontend/scripts/check_rust_code_lines.js --include src-tauri/src --exclude src-tauri/target
        language: system
        files: ^frontend/src-tauri/.*\.rs$
        pass_filenames: true

      # Rust format check (rustfmt)
      - id: rustfmt
        name: Rust format (rustfmt)
        entry: python scripts/precommit_rustfmt.py
        language: system
        files: ^frontend/src-tauri/.*\.rs$
        pass_filenames: false

      # Rust linter (clippy)
      - id: clippy
        name: Rust linter (clippy)
        entry: python scripts/precommit_clippy.py
        language: system
        files: ^frontend/src-tauri/.*\.rs$
        pass_filenames: false
