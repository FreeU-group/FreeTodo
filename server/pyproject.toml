[project]
name = "lifetrace-server"
version = "0.1.2"
description = "Lifetrace Server — Center node (FastAPI backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core dependencies
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "python-multipart>=0.0.6",
    "icalendar>=6.0.0",
    "torch>=2.8.0",
    # Audio processing
    "websockets>=16.0",
    "opuslib>=3.0.1",
    "pyogg>=0.6",
    # Data processing
    "numpy>=2.4.2",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=1.4.1",
    "scipy>=1.9.0",
    "hdbscan>=0.8.0",
    # Scheduler
    "apscheduler>=3.10.0",
    # Utils
    "psutil>=7.2.0",
    # OpenAI API
    "openai>=2.16.0",
    # DashScope API
    "dashscope>=1.25.0",
    # Agno Agent Framework
    "agno>=2.4.8",
    "ddgs>=9.10.0",
    "tavily-python>=0.7.0",
    # Configuration
    "dynaconf[yaml]>=3.2.0",
    # Logging
    "loguru>=0.7.3",
    # Observability
    "openinference-instrumentation>=0.1.0",
    "openinference-instrumentation-agno>=0.1.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0",
    "openinference-instrumentation-openai>=0.1.41",
    "pandas>=3.0.1",

]

[dependency-groups]
dev = [
    "bandit>=1.9.3",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pyright>=1.1.408",
    "ruff>=0.14.14",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "build", "dist"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "UP", "PL", "C90", "A", "ARG", "N", "TC", "FA", "ISC", "FLY", "DTZ", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "DTZ001", "DTZ005", "PLR2004", "TC003"]
"routers/hardware_audio.py" = ["TC001", "TC002"]
"routers/omi_compat/*.py" = ["ARG001", "PLC0415"]

[tool.ruff.lint.pylint]
max-statements = 50
max-args = 7
max-returns = 6
max-branches = 12
max-public-methods = 20

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
extra-index-url = ["https://pypi.org/simple"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# 告诉 uv，torch 相关的包去 pytorch-cpu 这个索引找
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
