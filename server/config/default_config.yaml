    disable_after_failures: 1 # 杩炵画澶辫触杈惧埌闃堝€煎悗鑷姩绂佺敤 Phoenix 瀵煎嚭
    retry_cooldown_sec: 60 # 瑙﹀彂绂佺敤鍚庡涔呭皾璇曟仮澶嶏紙绉掞紝0 琛ㄧず涓嶈嚜鍔ㄩ噸璇曪級
