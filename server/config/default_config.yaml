# LifeTrace 榛樿閰嶇疆鏂囦欢

# 锛侊紒锛侀噸瑕佹彁绀猴細
# 璇峰嬁缂栬緫姝ゆ枃浠?default_config.yaml锛屾墍鏈夐厤缃兘搴斿湪 config.yaml 涓繘琛岃缃?
# 濡傛灉 config.yaml 涓嶅瓨鍦紝绯荤粺浼氳嚜鍔ㄤ粠 default_config.yaml 澶嶅埗骞剁敓鎴?
# 濡傛灉 config.yaml 瀛樺湪锛岀郴缁熶細鑷姩楠岃瘉瀹屾暣鎬э紝濡傛灉涓嶅畬鏁达紝绯荤粺浼氳嚜鍔ㄦ彁绀哄苟閫€鍑?
# 褰撴鎻愮ず鍑虹幇鍦?config.yaml 涓椂锛岃蹇界暐

# 初始化向导配置
setup:
  completed: false
  user_name: ""
  agent_name: "Free U"
  scan_directories: []
  allowed_apps:
    - 微信

# 部署角色配置
deployment:
  role: standalone # standalone锛堝崟鏈猴級 | center锛堜腑蹇冭妭鐐癸紝鎺ュ彈杩滅▼鎰熺煡鏁版嵁锛?

# 鏈嶅姟鍣ㄩ厤缃?
server:
  host: 127.0.0.1
  port: 8001
  debug: false

# 鍚庣妯″潡鍚敤閰嶇疆锛堣交閲忔彃浠跺寲锛?
backend_modules:
  enabled:
    - health
    - config
    - system
    - logs
    - chat
    - agent_plan
    - activity
    - search
    - screenshot
    - event
    - ocr
    - vector
    - rag
    - scheduler
    - automation
    - cost_tracking
    - time_allocation
    - todo
    - todo_extraction
    - journal
    - diary_illustration
    - vision
    - notification
    - floating_capture
    - crawler
    - audio
    - perception
    - perception_ingest
    - sensor_control
    - plugin
    - memory
    - omi_compat
    - location

# Omi App / 纭欢鍏煎灞傞厤缃?
omi_compat:
  token: "lifetrace-omi-compat-2026"
  uid: "lifetrace-user"

# 杩滅▼鎰熺煡鑺傜偣 (Sensor) 閰嶇疆
sensor:
  screenshot_enabled: true
  screenshot_interval: 10.0
  proactive_ocr_enabled: true
  proactive_ocr_interval: 1.0

# 鎰熺煡娴侊紙Perception Stream锛夐厤缃?
perception:
  enabled: true
  window_seconds: 300
  max_pending_events: 1000
  status_online_window_seconds: 60
  audio_enabled: true
  audio_source: mic_pc
  ocr_enabled: true
  input_enabled: true
  todo_intent:
    enabled: true
    mode: memory_preview # memory_preview | draft | active | review_queue
    disable_legacy_auto_extraction: true # 鍚敤鍚庤烦杩囨棫鑷姩鎻愬彇閾捐矾锛坅udio/proactive_ocr/todo_recorder锛?
    window_seconds: 5
    max_context_chars: 5000
    max_todos_per_context: 5
    internal_queue_maxsize: 200
    processing_workers: 2
    processing_queue_maxsize: 200
    max_recent_records: 200
    pre_gate_dedupe:
      enabled: true
      exact_window_seconds: 90
      similarity_enabled: false
      similarity_threshold: 0.92
      max_cache_size: 5000
    gate:
      enabled: true
      model: "qwen-turbo" # 闂ㄦ帶鍙渶鍒ゆ柇 true/false锛岀敤杞婚噺妯″瀷鍔犻€?
      temperature: 0.0
      max_tokens: 160
      min_text_length: 8
      prompt_category: transcription_extraction_gate
    extractor:
      model: "" # 绌哄垯鍥為€€ llm.todo_extraction_model 鎴?llm.model
      temperature: 0.2
      max_tokens: 800
      prompt_category: perception_todo_intent_extraction
    integration:
      post_extract_dedupe_window_seconds: 600
      create_confidence_threshold: 0.7
      update_confidence_threshold: 0.75

# 鍩虹鐩綍閰嶇疆
base_dir: data
database_path: lifetrace.db
screenshots_dir: screenshots/
attachments_dir: attachments/

# 鏃ュ織閰嶇疆
logging:
  level: INFO
  console_level: INFO
  file_level: INFO
  quiet_modules: [] # 绀轰緥: ["activity_service", "event_service"]
  log_path: logs/
  # 澹扮汗/CAM++ 鐩稿叧鏃ュ織鍗曠嫭杈撳嚭鍒版鐩綍锛岀暀绌哄垯涓庝富鏃ュ織鍚堝苟
  speaker_log_path: "" # 渚嬪: logs/speaker/

# 璋冨害鍣ㄩ厤缃?
scheduler:
  enabled: true # 鍚敤璋冨害鍣?
  database_path: scheduler.db # 璋冨害鍣ㄦ暟鎹簱璺緞
  max_workers: 10 # 鏈€澶у伐浣滅嚎绋嬫暟
  coalesce: true # 鍚堝苟閿欒繃鐨勪换鍔?
  max_instances: 1 # 鍚屼竴浠诲姟鍚屾椂鍙兘鏈変竴涓疄渚?
  misfire_grace_time: 60 # 閿欒繃瑙﹀彂鏃堕棿鐨勫蹇嶅害锛堢锛?
  timezone: Asia/Shanghai # 鏃跺尯

# 瀹氭椂浠诲姟
jobs:
  audio_recording:
    id: audio_recording # 浠诲姟ID
    name: 闊抽褰曞埗 # 浠诲姟鏄剧ず鍚嶇О锛堜腑鏂囷級
    enabled: false # 鏄惁鍚敤闊抽褰曞埗锛堥粯璁ゅ叧闂紝7x24灏忔椂褰曞埗锛?
    interval: 60 # 鐘舵€佹鏌ラ棿闅旓紙绉掞級锛岀敤浜庣洃鎺у綍闊崇姸鎬?
    params:
      segment_duration_minutes: 30 # 鍒嗘鏃堕暱锛堝垎閽燂級
      silence_threshold_seconds: 600 # 闈欓煶妫€娴嬮槇鍊硷紙绉掞級
  activity_aggregator:
    id: activity_aggregator # 浠诲姟ID
    name: 娲诲姩鑱氬悎 # 浠诲姟鏄剧ず鍚嶇О锛堜腑鏂囷級
    enabled: false # 鏄惁鍚敤娲诲姩鑱氬悎浠诲姟锛堥粯璁ゅ叧闂紝闇€鐢ㄦ埛鎵嬪姩寮€鍚級
    interval: 900 # 妫€鏌ラ棿闅旓紙绉掞級锛岄粯璁?5鍒嗛挓
  clean_data:
    id: clean_data # 浠诲姟ID
    name: 鎴浘娓呯悊 # 浠诲姟鏄剧ず鍚嶇О锛堜腑鏂囷級
    enabled: false # 鏄惁鍚敤鎴浘娓呯悊浠诲姟锛堥粯璁ゅ叧闂紝闇€瑕佹椂鎵嬪姩寮€鍚級
    interval: 3600 # 妫€鏌ラ棿闅旓紙绉掞級锛岄粯璁ゆ瘡灏忔椂妫€鏌ヤ竴娆?
    params:
      max_screenshots: 10000 # 鏈€澶ф埅鍥炬暟閲忛檺鍒?
      max_days: 30 # 鏁版嵁淇濈暀澶╂暟锛堟寜鏃ユ湡娓呯悊鏃ф暟鎹級
      delete_file_only: true # 鍙垹闄ゆ枃浠讹紙true锛夛紝杩樻槸鍚屾椂鍒犻櫎璁板綍锛坒alse锛?
  deadline_reminder:
    id: deadline_reminder # 浠诲姟ID
    name: DDL鎻愰啋 # 浠诲姟鏄剧ず鍚嶇О锛堜腑鏂囷級
    enabled: false # 鏄惁鍚敤 DDL 鎻愰啋浠诲姟锛堥粯璁ゅ叧闂紝闇€鐢ㄦ埛鎵嬪姩寮€鍚級
    params:
      reminder_window_minutes: 5 # 鍏煎淇濈暀瀛楁锛屼笉鍐嶄綔涓哄緟鍔為粯璁ゆ彁閱?
  auto_todo_detection:
    id: auto_todo_detection
    name: 鑷姩寰呭姙妫€娴?
    enabled: true
  diary_illustration:
    id: diary_illustration
    name: 鏃ヨ鎻掔敾鐢熸垚
    enabled: false
    cron: "0 22 * * *"

# 鍚戦噺鏁版嵁搴撻厤缃?
vector_db:
  enabled: true # 鍚敤鍚戦噺鏁版嵁搴?
  collection_name: lifetrace_ocr # 闆嗗悎鍚嶇О
  embedding_model: shibing624/text2vec-base-chinese # 宓屽叆妯″瀷
  rerank_model: BAAI/bge-reranker-base # 閲嶆帓搴忔ā鍨?
  persist_directory: vector_db # 鎸佷箙鍖栫洰褰?

# 鑱婂ぉ閰嶇疆
chat:
