  history_limit: 10 # 鍘嗗彶璁板綍杞暟闄愬埗锛?杞?1涓敤鎴锋秷鎭?1涓姪鎵嬪洖澶嶏級

# Agno Learning 閰嶇疆
agno:
  user_id: local-user # 榛樿鐢ㄦ埛 ID锛堢敤浜庝釜浜虹敾鍍?璁板繂锛?
  default_workspace: "." # 榛樿宸ヤ綔鍖鸿矾寰勶紙Agent 鏂囦欢鎿嶄綔鐨勬牴鐩綍锛?
  learning:
    enabled: true # 鏄惁鍚敤 Agno Learning
    mode: always # always | agentic
    db_path: agno/learning.db # 鐩稿 base_dir 鐨勫涔犳暟鎹簱璺緞
    add_history_to_context: false # 鏄惁浣跨敤 Agno 鑷甫鍘嗗彶娉ㄥ叆
  tracing:
    enabled: true # 鏄惁鍚敤 Agno Tracing锛堢敤浜?AgentOS 璋冭瘯锛?
    db_path: agno/traces.db # 鐩稿 base_dir 鐨?Tracing 鏁版嵁搴撹矾寰勶紙寤鸿鐙珛 DB锛?
    use_setup_tracing: true # 鏄惁璋冪敤 Agno setup_tracing 杩涜鏇寸粏绮掑害閰嶇疆
    batch_processing: true # setup_tracing 鎵瑰鐞嗗紑鍏?
    max_queue_size: 2048 # setup_tracing 闃熷垪鏈€澶ч暱搴?
    schedule_delay_millis: 3000 # setup_tracing 鎵瑰鐞嗚皟搴﹂棿闅旓紙姣锛?
  agent_os:
    enabled: true # 鏄惁鍚敤 AgentOS 鍏ュ彛
    host: 127.0.0.1 # AgentOS 鐩戝惉鍦板潃
    port: 8002 # AgentOS 鐩戝惉绔彛
    debug: true # AgentOS 璋冭瘯妯″紡锛堢嫭绔嬩簬 server.debug锛?
    base_url: "" # 鍙€夛細鐩存帴鎸囧畾 AgentOS 璁块棶鍦板潃锛堜紭鍏堢骇鏈€楂橈級
    agent_id: freetodo-agent # AgentOS 涓殑 Agent ID
    agent_name: FreeTodo Agent # AgentOS 涓殑 Agent 鍚嶇О
    lang: en # AgentOS 榛樿璇█
    timeout_sec: 60 # AgentOS 璋冪敤瓒呮椂锛堢锛?
    selected_tools: [] # 绌鸿〃绀哄惎鐢ㄥ叏閮?Lifetrace 宸ュ叿锛圓gentOS 鍚姩鏃讹級
    external_tools: [] # 绌鸿〃绀哄惎鐢ㄥ叏閮ㄥ閮ㄥ伐鍏凤紙AgentOS 鍚姩鏃讹級
    external_tools_config: {} # 棰勭暀澶栭儴宸ュ叿閰嶇疆

# LLM閰嶇疆
llm:
  api_key: YOUR_LLM_KEY_HERE # LLM 瀵嗛挜锛岄渶瑕佺敤鎴烽厤缃?
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1 # LLM API鍩虹URL
  model: qwen-plus # 浣跨敤鐨勬ā鍨嬪悕绉?
  vision_model: qwen3-vl-plus # 瑙嗚澶氭ā鎬佹ā鍨嬪悕绉帮紙鐢ㄤ簬鍥剧墖鍒嗘瀽锛?
  todo_extraction_model: "" # 寰呭姙鎻愬彇涓撶敤妯″瀷锛堢暀绌哄垯浣跨敤涓绘ā鍨嬶紝鎺ㄨ崘 qwen-turbo 绛夊揩閫熸ā鍨嬶級
  temperature: 0.7 # 娓╁害鍙傛暟
  max_tokens: 2048 # 鏈€澶oken鏁?
  # 妯″瀷浠锋牸閰嶇疆锛堝崟浣嶏細浜烘皯甯?鍗僼oken锛?
  model_prices:
    default: # 榛樿浠锋牸锛岀敤浜庢湭閰嶇疆鐨勬ā鍨嬶紙qwen-plus锛?
      input_price: 0.0008 # 杈撳叆token浠锋牸
      output_price: 0.002 # 杈撳嚭token浠锋牸
    qwen3-max:
      input_price: 0.0032
      output_price: 0.0128
    qwen-plus:
      input_price: 0.0008
      output_price: 0.002
    qwen-turbo:
      input_price: 0.0003
      output_price: 0.0006
    qwen3-vl-plus: # 瑙嗚妯″瀷浠锋牸锛堟敮鎸侀潪鎬濊€?鎬濊€冩ā寮忥紝鎸夎緭鍏oken鍒嗗眰璁′环锛?
      # 鍏煎鏃ч€昏緫鐨勫熀纭€鍗曚环锛堥粯璁ゅ彇绗竴妗ｏ級
      input_price: 0.001 # 杈撳叆token浠锋牸锛堝厓/鍗僼oken锛?
      output_price: 0.01 # 杈撳嚭token浠锋牸锛堝厓/鍗僼oken锛?
      tiers:
        # (0, 32,000]
        - max_input_tokens: 32000
          input_price: 0.001
          output_price: 0.01
        # (32,000, 128,000]
        - max_input_tokens: 128000
          input_price: 0.0015
          output_price: 0.015
        # (128,000, 256,000]
        - max_input_tokens: 256000
          input_price: 0.003
          output_price: 0.03

# Tavily 閰嶇疆锛堣仈缃戞悳绱級
tavily:
  api_key: YOUR_TAVILY_API_KEY_HERE # Tavily API Key锛岄渶瑕佺敤鎴烽厤缃?
  search_depth: basic # 鎼滅储娣卞害锛歜asic 鎴?advanced
  max_results: 5 # 鏈€澶ц繑鍥炵粨鏋滄暟
  include_domains: [] # 鍖呭惈鐨勫煙鍚嶅垪琛紙鍙€夛級
  exclude_domains: [] # 鎺掗櫎鐨勫煙鍚嶅垪琛紙鍙€夛級

# Gemini 鍥惧儚鐢熸垚閰嶇疆锛堟棩璁版彃鐢伙級
banna2:
  api_key: YOUR_GOOGLE_GEMINI_API_KEY_HERE
  ref_image_path: ""

# 闊抽璇嗗埆閰嶇疆锛堥樋閲屼簯Fun-ASR锛?
audio:
  is_24x7: false # 7x24灏忔椂褰曞埗妯″紡锛堣嚜鍔ㄥ惎鍔ㄥ綍闊筹紝榛樿鍏抽棴锛?
  extraction_gate:
    enabled: true # 鏄惁鍚敤"鍏堢敤 LLM 鍒ゆ柇鍐嶆彁鍙?鐨?gate
    model: "" # gate 浣跨敤妯″瀷锛涚暀绌哄垯浣跨敤 llm.model
    min_text_length: 5 # gate 鏈€灏忔枃鏈暱搴︼紙瀛楃锛夛紱浣庝簬璇ュ€肩洿鎺ヨ烦杩囨彁鍙?
    max_chars: 2500 # gate 鍗曟璋冪敤杈撳叆鏈€澶у瓧绗︽暟锛堣繃闀胯嚜鍔ㄥ垎鍧楋級
    max_seconds: 300 # gate/鎻愬彇鍒嗗潡鏈€澶ф椂闀匡紙绉掞級锛?=涓嶆寜鏃堕暱鍒嗗潡
    max_tokens: 160 # gate 杈撳嚭鏈€澶?token
    temperature: 0.0 # gate 娓╁害锛堝缓璁?0锛?
  asr:
    api_key: YOUR_LLM_KEY_HERE # 闃块噷浜戠櫨鐐糀PI Key
    base_url: wss://dashscope.aliyuncs.com/api-ws/v1/inference/ # WebSocket鍦板潃
    model: fun-asr-realtime # 浣跨敤鐨勬ā鍨嬪悕绉?
    sample_rate: 16000 # 閲囨牱鐜囷紙Hz锛?
    format: pcm # 闊抽鏍煎紡锛歱cm, wav, mp3, opus, speex, aac, amr
    semantic_punctuation_enabled: false # 鏄惁寮€鍚涔夋柇鍙?
    max_sentence_silence: 1300 # VAD闈欓煶鏃堕暱闃堝€硷紙姣锛?
    heartbeat: false # 鏄惁寮€鍚暱杩炴帴淇濇寔
  speaker:
    enabled: true # 鏄惁鍚敤璇磋瘽浜鸿瘑鍒?
    # CAM++ 澹扮汗妯″瀷閰嶇疆锛堟湰鍦?FunASR锛岄粯璁ゆ柟妗堬級
    model: iic/speech_campplus_sv_zh-cn_16k-common
    device: cpu
    min_audio_duration: 2.5 # 鏈€灏忛煶棰戞椂闀匡紙绉掞級锛屼綆浜庢涓嶆彁鍙栧０绾?
    buffer_duration: 8.0 # 闊抽缂撳啿鏃堕暱锛堢锛夛紝姣忔鎻愬彇澹扮汗鐨勯煶棰戦噺
    vad_enabled: true # 鏄惁鍚敤 FSMN-VAD 璇煶鍒囧垎锛堟寜璇磋瘽杞鍒囨锛屾彁楂樺浜哄璇濊瘑鍒噯纭巼锛?
    # Diart 瀹炴椂璇磋瘽浜哄垎绂伙紙鍙€夛紝浼樺厛浜?CAM++锛岄渶 pip install diart 骞剁櫥褰?HuggingFace锛?
    diart:
      enabled: false # 榛樿鍏抽棴锛涘紑鍚悗闇€ torchaudio<=2.8 涓?huggingface-cli login
      step: 0.5 # 澶勭悊姝ラ暱锛堢锛?
      latency: 0.5 # 鏈€灏忓欢杩燂紙绉掞紝0.5-5.0锛?
      tau_active: 0.5 # 璇磋瘽浜烘椿璺冨害闃堝€硷紙0-1锛?
      rho_update: 0.3 # 澹扮汗鏇存柊闃堝€?
      delta_new: 1.0 # 鏂拌璇濅汉妫€娴嬮槇鍊?
      segmentation_model: pyannote/segmentation-3.0
      embedding_model: pyannote/embedding
    # 澹扮汗搴撻厤缃紙VoiceprintStore锛?
    embedding_dim: 192 # 澹扮汗鍚戦噺缁村害
    similarity_threshold: 0.68 # 浣欏鸡鐩镐技搴﹀尮閰嶉槇鍊硷紙CAM++ 鍚屼汉鍏稿瀷 0.7-0.95锛屼笉鍚屼汉 0.3-0.6锛?
    new_speaker_confirm_count: 2 # 杩炵画鏈尮閰嶆鏁拌揪鍒版鍊兼墠鍒涘缓鏂拌璇濅汉锛堥槻姝㈢煭鏆傛尝鍔級
    max_speakers: 100 # 澹扮汗搴撴渶澶ц璇濅汉鏁?
    auto_create_speaker: true # 鏈尮閰嶆椂鏄惁鑷姩鍒涘缓鏂拌璇濅汉
    update_voiceprint: true # 鍖归厤鍚庢槸鍚﹁拷鍔犳柊鐨勫０绾规牱鏈?
    max_samples_per_speaker: 10 # 姣忎釜璇磋瘽浜烘渶澶氫繚瀛樼殑澹扮汗鏍锋湰鏁?
  # 浜屾澶勭悊锛堢绾?ASR + 璇磋瘽浜哄垎绂伙級锛屽瀹炴椂杞綍缁撴灉杩涜绮句慨
  second_pass:
    enabled: true # 鍚敤鍚庡 /v4/listen 鐨勯煶棰戣繘琛岀绾夸簩娆¤浆褰?
    model: paraformer-v2 # 绂荤嚎 ASR 妯″瀷
    base_url: "" # 可选：当 model=whisper-large-v3 时可指定 OpenAI 兼容转写服务地址（留空则使用 llm.base_url）
    min_duration_seconds: 0.5 # 最短音频时长（秒），低于此值跳过二次处理
    debounce_seconds: 3 # 妫€娴嬪埌鍙ュ瓙缁撴潫鍚庣瓑寰呯殑鍘绘姈鏃堕棿锛堢锛夛紝閬垮厤杩炵画璇磋瘽鏃堕绻佽Е鍙?
    interval_seconds: 30 # 鏈€澶х瓑寰呴棿闅旓紙绉掞級锛屾寔缁璇濇椂涔熶細鎸夋闂撮殧瑙﹀彂
    diarization_enabled: true # 鏄惁鍚敤璇磋瘽浜哄垎绂?
    speaker_count: 0 # 璇磋瘽浜烘暟閲忔彁绀猴紙0=鑷姩妫€娴嬶級
    language_hints: ["zh", "en"] # 寰呰瘑鍒绉?
    disfluency_removal_enabled: false # 鏄惁杩囨护璇皵璇?
    temp_audio_dir: second_pass_audio/ # 涓存椂闊抽鏂囦欢鐩綍锛堢浉瀵?base_dir锛?
    temp_audio_max_age_hours: 24 # 涓存椂闊抽鏂囦欢淇濈暀鏃堕暱锛堝皬鏃讹級
  storage:
    audio_dir: audio/ # 闊抽鏂囦欢瀛樺偍鐩綍
    temp_audio_dir: temp_audio/ # 涓存椂闊抽鏂囦欢鐩綍

# 鍙娴嬫€ч厤缃紙Phoenix + OpenInference锛?
observability:
